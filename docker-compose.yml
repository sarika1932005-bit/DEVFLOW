services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devflow}
      POSTGRES_DB: ${POSTGRES_DB:-devflow}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-devflow}:${POSTGRES_PASSWORD:-devflow}@db:5432/${POSTGRES_DB:-devflow}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 10}
    restart: unless-stopped
  worker:
    build: ./backend
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-devflow}:${POSTGRES_PASSWORD:-devflow}@db:5432/${POSTGRES_DB:-devflow}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}, backend: {condition: service_healthy}}
    restart: unless-stopped
  beat:
    build: ./backend
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=INFO", "--pidfile="]
    environment: *backend_env
    depends_on: {redis: {condition: service_healthy}, backend: {condition: service_healthy}}
    restart: unless-stopped
  frontend:
    build: {context: ./frontend, args: {VITE_API_BASE_URL: ""}}
    ports: ["8080:8080"]
    depends_on: {backend: {condition: service_healthy}}
    restart: unless-stopped
volumes:
  postgres_data:
